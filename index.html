<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This tag handles the automatic redirect -->
    <meta http-equiv="refresh" content="0; url=https://www.example.com/">
    <title></title>
</head>
<body>
    <!-- Fallback link in case the automatic redirect fails -->

       <a href="https://www.example.com/">Here</a>.</p>
</body>
</html>
